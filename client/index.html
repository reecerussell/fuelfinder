<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuel Finder – cheapest petrol &amp; diesel prices near you</title>
    <meta
      name="description"
      content="Find the cheapest petrol and diesel near you. Live pump prices from every UK forecourt, reported to the government Fuel Finder scheme. Search by postcode or your location."
    />
    <link rel="canonical" href="https://findfuel.live/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f5f1e8" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fuel Finder" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://findfuel.live/" />
    <meta property="og:title" content="Fuel Finder – cheapest petrol &amp; diesel near you" />
    <meta
      property="og:description"
      content="Live pump prices from every UK forecourt. Search by postcode or your location."
    />
    <meta property="og:image" content="https://findfuel.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fuel Finder – live UK fuel prices near you" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fuel Finder – cheapest petrol &amp; diesel near you" />
    <meta
      name="twitter:description"
      content="Live pump prices from every UK forecourt. Search by postcode or your location."
    />
    <meta name="twitter:image" content="https://findfuel.live/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Fuel Finder",
        "url": "https://findfuel.live/",
        "description": "Find the cheapest petrol and diesel near you using live UK pump prices.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "inLanguage": "en-GB",
        "areaServed": { "@type": "Country", "name": "United Kingdom" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Fuel Finder shows live petrol and diesel prices at UK forecourts near you. Please enable JavaScript to search.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
